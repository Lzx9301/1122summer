<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生資料存儲系統</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <link rel="icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

</head>
<body>
    <div class="container">
        <h1>學生資料存儲系統</h1>

        <h2 id="search">查詢學生資料</h2>
        <input type="text" id="searchName" placeholder="輸入學生姓名">

        <div id="uploadSection"></div>
        <div id="historySection">
            <h3>上傳紀錄</h3>
            <div id="history" class="history-list">
                （輸入姓名後按下方按鈕查詢）
            </div>
        </div>

        <div id="BTN">
            <button id="searchButton">查詢上傳紀錄</button><br>
            <button id="toggleButton">補充資料區</button>
        </div>

        <div id="extraInfo" style="display: none;">
            <h2>補充資料</h2>
            <img src="./646454.jpg" id="line">
            <h4>社團群組</h4>
            <img src="./646457.jpg" id="line">
            <h4>官方Line師生聯絡區</h4>
        </div>
    </div>

    <img src="ByteFox.png" id="bytefox" alt="比特狐">

    <!-- 只留一個，務必是 type="module" -->
    <script type="module" src="./scripts.js?v=1"></script>


</body>
</html>
